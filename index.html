<!DOCTYPE html>
<html lang="en">

<head>

<body>
    <button onclick="googleLogin()">SignIn With Google</button>
</body>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>

<script>

        authDomain: "login-995d5.firebaseapp.com",
        projectId: "login-995d5",
        storageBucket: "login-995d5.firebasestorage.app",
        messagingSenderId: "98461145611",

    };

    firebase.initializeApp(firebaseConfig);

<script>
    const googleLogin = () => {
        var provider = new firebase.auth.GoogleAuthProvider();
        provider.addScope('https://www.googleapis.com/auth/contacts.readonly');
        firebase.auth()
            .signInWithPopup(provider)
            .then((snap) => {
                var key = snap.user.uid
                console.log(snap)
                firebase.database().ref("user").child(key).set({
                    key: key,
                    email: snap.user.email,
                    name: snap.user.displayName,
                    photo: snap.user.photoURL


                })
                alert("signin successfull")

            })
    }
</script>

</html>
